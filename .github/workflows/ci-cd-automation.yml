name: CI/CD Automation Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    name: "Build and Test Pipeline"
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Backend Checks
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI Backend
        working-directory: ./backend
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 10

      # Frontend Checks
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Application
        working-directory: ./frontend
        run: npm run build

      - name: Start Next.js Server
        working-directory: ./frontend
        run: |
          npm run start &
          sleep 10

      - name: Run Cypress E2E Test Suite
        working-directory: ./frontend
        run: npx cypress run --spec "cypress/e2e/decision_studio.cy.js"

      # Security Scans
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  auto-docs:
    name: "Auto Generate Repository State"
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Script Dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Repository Analyzer
        run: python scripts/repo_analyzer.py

      - name: Run Diagram Generator
        run: python scripts/diagram_generator.py

      - name: Run Knowledge Graph Generator
        run: python scripts/knowledge_graph.py

      - name: Run AI Documentation Agent
        run: python scripts/ai_doc_agent.py

      - name: Commit Generated Documentation
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update architecture, diagrams, and knowledge graph [skip ci]"
          file_pattern: "README.md docs/* repo_state.json"
